<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Pleads Of Trafalgar</title>
        <script type="module" src="./js/index.js"></script>
        <style>
            * {
                margin: 0;
                overflow: hidden;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #140c1c;
            }

            canvas {
                border: 2px solid rgb(65, 65, 65);
                image-rendering: pixelated;
            }
        
            #controls {
                width: 260px;
                padding: 14px 16px;
                background: #2b1d14;
                color: #f3e3c3;
                border: 2px solid #6b4a2f;
                box-shadow: 4px 4px 0 #000;
                font-family: monospace;
                font-size: 13px;
                line-height: 1.4;
                margin-left: 5rem;
            }
        
            #controls h2 {
                margin-bottom: 10px;
                padding-bottom: 6px;
                border-bottom: 2px solid #6b4a2f;
                color: #ffd866;
                font-size: 16px;
                letter-spacing: 2px;
                text-transform: uppercase;
            }
        
            #controls dl + dl {
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px dashed #6b4a2f;
            }
        
            #controls .row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 6px 0;
            }
        
            #controls dt {
                display: flex;
                align-items: center;
                gap: 3px;
                flex: 0 0 88px;
            }
        
            #controls dt span {
                color: #a88b63;
            }
        
            #controls dd {
                flex: 1;
            }
        
            #controls kbd {
                display: inline-block;
                min-width: 22px;
                padding: 2px 5px;
                background: #f3e3c3;
                color: #2b1d14;
                border: 1px solid #a88b63;
                border-bottom-width: 3px;
                font-family: inherit;
                font-weight: bold;
                text-align: center;
            }
        
            #controls kbd.wide {
                padding: 2px 10px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <aside id="controls">
        <h2>Controls</h2>

        <dl>
            <div class="row">
                <dt><kbd>W</kbd><span>/</span><kbd>&uarr;</kbd></dt>
                <dd>Go forward</dd>
            </div>
            <div class="row">
                <dt><kbd>S</kbd><span>/</span><kbd>&darr;</kbd></dt>
                <dd>Go backwards</dd>
            </div>
            <div class="row">
                <dt><kbd>A</kbd><span>/</span><kbd>&larr;</kbd></dt>
                <dd>Turn left</dd>
            </div>
            <div class="row">
                <dt><kbd>D</kbd><span>/</span><kbd>&rarr;</kbd></dt>
                <dd>Turn right</dd>
            </div>
        </dl>
    
        <dl>
            <div class="row">
                <dt><kbd>E</kbd><span>/</span><kbd>M</kbd></dt>
                <dd>Open chest or rescue general</dd>
            </div>
            <div class="row">
                <dt><kbd>F</kbd><span>/</span><kbd>N</kbd></dt>
                <dd>Lantern on/off</dd>
            </div>
            <div class="row">
                <dt><kbd class="wide">Space</kbd></dt>
                <dd>Use selected item</dd>
            </div>
            <div class="row">
                <dt><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></dt>
                <dd>Switch selected item</dd>
            </div>
            <div class="row">
                <dt><kbd class="wide">Mouse</kbd></dt>
                <dd>Drag and drop to move items</dd>
            </div>
        </dl>
    </aside>
    </body>
</html>
